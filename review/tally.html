<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>후기 심사 투표 집계</title>
<style>
:root{--bur:#7D2621;--ink:#4A2C20;--cream:#FFF8EE;--line:#EBD7C0;--mute:#8E6E5E;--gold:#E9B949}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{margin:0;color:var(--bur);font-size:24px}
form{display:flex;gap:8px;flex-wrap:wrap}
input{font:inherit;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;min-width:0;flex:1}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:9px 18px;background:var(--bur);color:#fff;cursor:pointer}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left}
th{background:#FBE9D4;font-size:14px}
td.n{text-align:right;font-weight:700}
.bar{height:10px;background:var(--gold);border-radius:5px}
.top td{background:#FFF3DC}
p{margin:0;color:var(--mute);font-size:14px}
</style></head><body><main>
<h1>후기 심사 투표 집계</h1>
<p>Netlify 환경변수 ADMIN_KEY에 넣은 값을 입력하세요. 상위 10건은 배경색으로 표시돼요.</p>
<form id="f"><label for="k" hidden>관리자 키</label><input id="k" type="password" placeholder="관리자 키" autocomplete="off"><button>집계 보기</button></form>
<p id="s" role="status"></p>
<div id="out"></div>
</main>
<script src="data.js"></script>
<script>
const R=window.JUDGE.reviews,pad=n=>String(n).padStart(2,'0');
document.getElementById('f').onsubmit=e=>{e.preventDefault();const s=document.getElementById('s');s.textContent='불러오는 중이에요.';
 fetch('/api/vote?key='+encodeURIComponent(document.getElementById('k').value)).then(r=>r.json().then(j=>({ok:r.ok,j}))).then(({ok,j})=>{
  if(!ok){s.textContent='키가 맞지 않아요.';return;}
  const rows=R.map(r=>({...r,c:j.tally[r.no]||0})).sort((a,b)=>b.c-a.c||a.no-b.no),max=Math.max(1,...rows.map(r=>r.c));
  s.textContent=`투표한 기기 ${j.voters}대`;
  document.getElementById('out').innerHTML=`<table><thead><tr><th>순위</th><th>번호</th><th>이름</th><th>표</th><th style="width:30%"></th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="${i<10?'top':''}"><td>${i+1}</td><td>${pad(r.no)}</td><td>${r.name} <small>${r.org}</small></td><td class="n">${r.c}</td><td><div class="bar" style="width:${r.c/max*100}%"></div></td></tr>`).join('')}</tbody></table>`;
 }).catch(()=>{s.textContent='불러오지 못했어요.';});};
</script></body></html>
